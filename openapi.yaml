openapi: 3.0.3
info:
  title: Queue Service API
  version: 1.0.0
  description: A fast, lightweight, persistence-optional Deno queue service
servers:
  - url: http://localhost:3000
    description: Default local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: Returns the health status of the service. Does not require authentication.
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '405':
          description: Method not allowed
        '429':
          description: Too many requests (Rate limit exceeded)
  /queues:
    get:
      summary: List all queues
      description: Returns a JSON array of all active queue names.
      responses:
        '200':
          description: Array of queue names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '429':
          description: Too many requests (Rate limit exceeded)
  /enqueue/{queue}:
    post:
      summary: Enqueue an item
      description: Adds a new payload to the specified queue.
      parameters:
        - in: path
          name: queue
          required: true
          schema:
            type: string
            maxLength: 128
          description: The name of the queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  description: The data to be enqueued. Can be any valid JSON type (string, object, etc.).
              required:
                - payload
      responses:
        '200':
          description: Payload successfully queued
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad Request - Invalid JSON or Queue name too long
        '401':
          description: Unauthorized
        '413':
          description: Payload too large (Max 1MB)
        '429':
          description: Too many requests (Rate limit exceeded)
        '507':
          description: Insufficient Storage - Queue full or too many queues
  /dequeue/{queue}:
    get:
      summary: Dequeue an item
      description: Removes and returns the oldest payload from the specified queue.
      parameters:
        - in: path
          name: queue
          required: true
          schema:
            type: string
            maxLength: 128
          description: The name of the queue.
      responses:
        '200':
          description: Successfully dequeued an item
          content:
            application/json:
              schema:
                description: The dequeued payload
        '204':
          description: No Content - Queue is empty
        '400':
          description: Bad Request - Queue name too long
        '401':
          description: Unauthorized
        '429':
          description: Too many requests (Rate limit exceeded)
  /peek/{queue}:
    get:
      summary: Peek at an item
      description: Returns the oldest payload from the specified queue without removing it.
      parameters:
        - in: path
          name: queue
          required: true
          schema:
            type: string
            maxLength: 128
          description: The name of the queue.
      responses:
        '200':
          description: Successfully peeked at an item
          content:
            application/json:
              schema:
                description: The peeked payload
        '204':
          description: No Content - Queue is empty
        '400':
          description: Bad Request - Queue name too long
        '401':
          description: Unauthorized
        '429':
          description: Too many requests (Rate limit exceeded)
  /length/{queue}:
    get:
      summary: Get queue length
      description: Returns the number of items currently in the specified queue.
      parameters:
        - in: path
          name: queue
          required: true
          schema:
            type: string
            maxLength: 128
          description: The name of the queue.
      responses:
        '200':
          description: The number of items in the queue
          content:
            text/plain:
              schema:
                type: integer
        '400':
          description: Bad Request - Queue name too long
        '401':
          description: Unauthorized
        '429':
          description: Too many requests (Rate limit exceeded)
