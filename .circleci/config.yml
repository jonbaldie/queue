version: 2.1

jobs:
  test:
    docker:
      - image: denoland/deno:2.7.6
    steps:
      - checkout
      - run:
          name: Run tests
          command: |
            touch persist.dat
            deno compile --allow-read --allow-write=./persist.dat --allow-net=0.0.0.0:3000 --allow-env=HOST,PORT,PERSIST,QUEUE_API_TOKEN main.ts
            deno test --allow-read --allow-write --allow-net --allow-env

workflows:
  test:
    jobs:
      - test
